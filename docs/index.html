<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Block</title>
  <style>
    :root { --bg: #f5f5fa; --fg: #1d1d1f; --muted: #6e6e73; --border: #e3e3e8; --accent: #4f46e5; --accent-fg: #fff; --danger: #c62828; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --border: #2e2e33; --accent: #818cf8; --accent-fg: #111114; --danger: #f87171; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 360px; width: 100%; }
    p { color: var(--muted); }
    form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
    button { padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Focus Block</h1>
    <p id="text"></p>
    <form id="reset-form" hidden>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      <input id="confirm" type="password" minlength="6" autocomplete="new-password" required>
      <button id="save-btn" type="submit"></button>
      <p id="form-error" class="error" hidden></p>
    </form>
  </main>
  <script>
    // Valores públicos do projeto Supabase (os mesmos de extension/config.js).
    const SUPABASE_URL = "https://ibbadpavucorzmjeeawy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_mxbTG3PDYGahux7ttckBLA_ndXbsFbI";

    const MESSAGES = {
      pt: {
        tagline: "Bloqueie sites que tiram seu foco.",
        checkoutSuccessTitle: "Assinatura confirmada! 🎉",
        checkoutSuccessText: "O Premium já está liberado. Pode fechar esta aba e abrir a extensão.",
        checkoutCancelTitle: "Checkout cancelado",
        checkoutCancelText: "Nenhuma cobrança foi feita. Você pode assinar quando quiser pela extensão.",
        confirmedTitle: "E-mail confirmado! ✅",
        confirmedText: "Abra a extensão Focus Block e clique em Entrar.",
        resetTitle: "Criar nova senha",
        resetText: "Digite sua nova senha abaixo.",
        newPassword: "Nova senha (mín. 6 caracteres)",
        confirmPassword: "Repita a nova senha",
        save: "Salvar nova senha",
        mismatch: "As senhas não são iguais.",
        resetDoneTitle: "Senha alterada! ✅",
        resetDoneText: "Abra a extensão Focus Block e entre com a nova senha.",
        linkErrorTitle: "Link inválido ou expirado",
        linkErrorText: "Peça um novo link pela extensão.",
      },
      en: {
        tagline: "Block the sites that steal your focus.",
        checkoutSuccessTitle: "Subscription confirmed! 🎉",
        checkoutSuccessText: "Premium is now unlocked. You can close this tab and open the extension.",
        checkoutCancelTitle: "Checkout canceled",
        checkoutCancelText: "You were not charged. You can subscribe anytime from the extension.",
        confirmedTitle: "Email confirmed! ✅",
        confirmedText: "Open the Focus Block extension and click Sign in.",
        resetTitle: "Create a new password",
        resetText: "Enter your new password below.",
        newPassword: "New password (min. 6 characters)",
        confirmPassword: "Repeat the new password",
        save: "Save new password",
        mismatch: "The passwords don't match.",
        resetDoneTitle: "Password changed! ✅",
        resetDoneText: "Open the Focus Block extension and sign in with your new password.",
        linkErrorTitle: "Invalid or expired link",
        linkErrorText: "Request a new link from the extension.",
      },
      es: {
        tagline: "Bloquea los sitios que te quitan el foco.",
        checkoutSuccessTitle: "¡Suscripción confirmada! 🎉",
        checkoutSuccessText: "Premium ya está activo. Puedes cerrar esta pestaña y abrir la extensión.",
        checkoutCancelTitle: "Pago cancelado",
        checkoutCancelText: "No se hizo ningún cobro. Puedes suscribirte cuando quieras desde la extensión.",
        confirmedTitle: "¡Correo confirmado! ✅",
        confirmedText: "Abre la extensión Focus Block y haz clic en Iniciar sesión.",
        resetTitle: "Crear nueva contraseña",
        resetText: "Escribe tu nueva contraseña abajo.",
        newPassword: "Nueva contraseña (mín. 6 caracteres)",
        confirmPassword: "Repite la nueva contraseña",
        save: "Guardar nueva contraseña",
        mismatch: "Las contraseñas no coinciden.",
        resetDoneTitle: "¡Contraseña cambiada! ✅",
        resetDoneText: "Abre la extensión Focus Block y entra con tu nueva contraseña.",
        linkErrorTitle: "Enlace inválido o expirado",
        linkErrorText: "Pide un nuevo enlace desde la extensión.",
      },
    };
    const lang = (navigator.language || "en").slice(0, 2);
    const t = MESSAGES[lang] || MESSAGES.en;
    document.documentElement.lang = lang in MESSAGES ? lang : "en";

    const $ = (id) => document.getElementById(id);
    function show(title, text) {
      $("title").textContent = title;
      $("text").textContent = text;
    }

    // Os links de e-mail do Supabase trazem o token no hash (#access_token=...&type=...).
    // Lemos e apagamos da barra de endereço na hora, para o token não ficar no histórico.
    const hash = new URLSearchParams(location.hash.slice(1));
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    const checkout = new URLSearchParams(location.search).get("checkout");
    const accessToken = hash.get("access_token");

    show("Focus Block", t.tagline);
    if (hash.get("error") || hash.get("error_code")) {
      show(t.linkErrorTitle, t.linkErrorText);
    } else if (accessToken && hash.get("type") === "recovery") {
      show(t.resetTitle, t.resetText);
      $("password").placeholder = t.newPassword;
      $("confirm").placeholder = t.confirmPassword;
      $("save-btn").textContent = t.save;
      $("reset-form").hidden = false;
      $("reset-form").addEventListener("submit", (event) => resetPassword(event, accessToken));
    } else if (accessToken) {
      show(t.confirmedTitle, t.confirmedText);
    } else if (checkout === "success") {
      show(t.checkoutSuccessTitle, t.checkoutSuccessText);
    } else if (checkout === "cancel") {
      show(t.checkoutCancelTitle, t.checkoutCancelText);
    }

    async function resetPassword(event, token) {
      event.preventDefault();
      const error = $("form-error");
      const password = $("password").value;
      if (password !== $("confirm").value) {
        error.textContent = t.mismatch;
        error.hidden = false;
        return;
      }
      $("save-btn").disabled = true;
      error.hidden = true;
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(data?.msg || data?.error_description || data?.message || `Erro ${res.status}`);
        // Encerra a sessão aberta pelo link; o usuário entra de novo pela extensão.
        await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
          method: "POST",
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${token}` },
        }).catch(() => {});
        $("reset-form").hidden = true;
        show(t.resetDoneTitle, t.resetDoneText);
      } catch (e) {
        error.textContent = e.message;
        error.hidden = false;
        $("save-btn").disabled = false;
      }
    }
  </script>
</body>
</html>
